<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#FBF6EC"/><stop offset="1" stop-color="#EFE3CF"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.2" fill="#D9C8AC" opacity=".55"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5A4325" flood-opacity=".22"/>
    </filter>
    <pattern id="tape" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#9FD3C1"/><rect width="9" height="18" fill="#C2E6D8"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <g transform="translate(256 256) scale(0.86) translate(-262 -275)">
  <!-- hintere Zettel -->
  <g filter="url(#sh)">
    <rect x="86" y="118" width="220" height="220" rx="10" fill="#A9C4F2" transform="rotate(-14 196 228)"/>
    <rect x="214" y="132" width="210" height="210" rx="10" fill="#F2B3C6" transform="rotate(11 319 237)"/>
    <rect x="150" y="196" width="232" height="232" rx="10" fill="#FFE98A" transform="rotate(-3 266 312)"/>
  </g>
  <!-- Klebestreifen -->
  <rect x="200" y="172" width="132" height="44" fill="url(#tape)" opacity=".92" transform="rotate(-8 266 194)"/>
  <!-- Route + Pin auf dem vorderen Zettel -->
  <g transform="rotate(-3 266 312)" fill="none" stroke="#2A2F3A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M186 392 C 218 352, 252 400, 284 362" stroke-width="9" stroke-dasharray="2 20"/>
    <path d="M312 262c-26 0-44 19-44 43 0 32 44 72 44 72s44-40 44-72c0-24-18-43-44-43z" fill="#E0603A" stroke-width="10"/>
    <circle cx="312" cy="305" r="14" fill="#FFF8EC" stroke-width="8"/>
    <path d="M176 384l18 18M194 384l-18 18" stroke-width="9"/>
  </g>
  </g>
</svg>
